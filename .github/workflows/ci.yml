name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # onnxruntime-gpu also runs on machines without an NVIDIA GPU (it falls back to the CPU),
      # so CI installs exactly what users get. Tests that need a GPU, downloaded models or the
      # real desktop are marked and skipped by default (see [tool.pytest.ini_options]).
      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
